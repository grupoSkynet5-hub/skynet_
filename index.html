<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisión de vehículo · Pro Autos</title>
<style>
:root{--bg:#f3f8ee;--card:#fff;--ink:#1f3a27;--mut:#5b6e60;--g1:#1a6b2a;--g2:#8fd14f;--line:#d6e6cc;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:#fff;border-bottom:4px solid var(--g2);padding:14px 16px;text-align:center}
header img{max-width:100%;width:380px;height:auto;filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 2px 10px rgba(11,90,30,.25))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px;color:var(--g1)}
.sub{margin:0 0 16px;color:var(--mut);font-size:.95rem}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 16px;margin:0 0 14px}
legend{font-weight:700;color:var(--g1);padding:0 6px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.95rem}
input[type=text],input[type=datetime-local],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:11px 14px;font-weight:700}
.sec{background:transparent;border:2px solid var(--g1);color:var(--g1)}
.pri{width:100%;background:linear-gradient(180deg,var(--g2),var(--g1));color:#fff;font-size:1.1rem;padding:15px}
.row{display:flex;gap:8px}.row input{flex:1}
.techs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-weight:500;margin:0}
.chip input{width:20px;height:20px;accent-color:var(--g1)}
.chip:has(input:checked){border-color:var(--g1);background:color-mix(in srgb,var(--g2) 22%,var(--bg))}
.loc{margin-top:8px;font-size:.9rem;color:var(--mut);word-break:break-all}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;right:4px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff}
#msg{margin:12px 0 0;font-size:.92rem;color:var(--mut)}#msg.err{color:var(--err)}
@media (max-width:380px){.techs{grid-template-columns:1fr}}
.otros{display:none;margin-top:10px}.otros.on{display:block}

body{background:#e8f4dc;position:relative;min-height:100vh;overflow-x:hidden}
header{background:transparent;border:0;box-shadow:none;padding:18px 16px 4px}
fieldset{background:rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(26,107,42,.12);border-color:rgba(255,255,255,.7)}
h1{color:var(--g1)}
.sub{color:#4d6b4f}
#msg{color:#1f3a27}#msg.err{color:#b3261e}

legend{float:left;width:100%;padding:0;margin:0 0 4px;font-size:1.05rem}
legend+*{clear:both}
#envios{display:grid;gap:10px}
[hidden]{display:none!important}
input[type=number],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
#descarga{display:block;margin-top:12px;text-align:center;font-weight:700;color:var(--g1)}
textarea.com{min-height:64px;margin-top:8px}
.grupo{margin-top:6px}
.grupo+.grupo{margin-top:18px;padding-top:6px;border-top:1px dashed var(--line)}
.otro-in{margin-top:8px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#f1f9e8,#e0f1cf,#f4faee,#d9eec4,#f1f9e8);background-size:300% 300%;animation:flujo 26s ease-in-out infinite}
.bg i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.6;animation:flota 20s ease-in-out infinite}
.bg i:nth-of-type(1){width:360px;height:360px;left:-90px;top:6%;background:radial-gradient(circle,rgba(143,209,79,.85),rgba(143,209,79,0) 70%)}
.bg i:nth-of-type(2){width:440px;height:440px;right:-130px;top:38%;background:radial-gradient(circle,rgba(46,140,64,.55),rgba(46,140,64,0) 70%);animation-duration:25s;animation-delay:-6s}
.bg i:nth-of-type(3){width:320px;height:320px;left:28%;bottom:-110px;background:radial-gradient(circle,rgba(170,180,170,.7),rgba(170,180,170,0) 70%);animation-duration:22s;animation-delay:-3s}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg .f{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-opacity:.4}
.bg .sb{stroke:#1a6b2a}.bg .sg{stroke:#7ed321}.bg .sc{stroke:#8a938a}
.bg .p{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60 940;stroke-dashoffset:1000;animation:pulso 7s linear infinite}
.bg .pb{stroke:#1a6b2a;filter:drop-shadow(0 0 5px #7fc77a)}
.bg .pg{stroke:#7ed321;filter:drop-shadow(0 0 6px #c4f08a)}
.bg .pc{stroke:#8a938a;filter:drop-shadow(0 0 5px #d0d6d0)}
.bg .nd{opacity:.9}
.bg .halo{fill:none;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:onda 3.6s ease-out infinite}
@keyframes pulso{to{stroke-dashoffset:0}}
@keyframes onda{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@keyframes flujo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes flota{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.12)}66%{transform:translate(-30px,30px) scale(.92)}}
@media (prefers-reduced-motion:reduce){.bg,.bg i,.bg .p,.bg .halo{animation:none!important}}
</style>
</head>

<div class="grupo"><label for="marca">Marca</label><input type="text" id="marca" placeholder="Ej. Toyota"><textarea class="com" id="marcaCom" placeholder="Comentarios (opcional)" aria-label="Comentarios de marca"></textarea></div>
<div class="grupo"><label for="veh">Vehículo</label><input type="text" id="veh" placeholder="Ej. Corolla 2022 placa  AHC-1235"><textarea class="com" id="vehCom" placeholder="Comentarios (opcional)" aria-label="Comentarios de vehículo"></textarea></div>
<div class="grupo"><label for="kmSel">Kilometraje</label><select id="kmSel"></select><input type="number" class="otro-in" id="kmExacto" inputmode="numeric" min="0" step="1" placeholder="Escribe el kilometraje exacto" hidden><textarea class="com" id="kmCom" placeholder="Comentarios (opcional)" aria-label="Comentarios de kilometraje"></textarea></div>
<div class="grupo"><label for="comb">Combustible</label><select id="comb"></select><textarea class="com" id="combCom" placeholder="Comentarios (opcional)" aria-label="Comentarios de combustible"></textarea></div>
</fieldset>

<fieldset><legend>Fotos</legend>
<input type="file" id="fotos" accept="image/*" multiple hidden>
<button type="button" class="sec" id="selF">Subir fotos</button>
<div class="thumbs" id="thumbs"></div>
</fieldset>

<fieldset><legend>Enviar por WhatsApp</legend>
<div id="envios"></div>
<a id="descarga" download="revision-vehiculo.jpg" hidden>Descargar imagen de la revisión</a>
</fieldset>
<p id="msg" role="status"></p>
</main>

<script>
// ====== CONFIGURACIÓN ======
// Número destino: con código de país (504 = Honduras), sin + ni espacios ni guiones
var DESTINOS = [
  {nombre:"Rene Chavez", num:"50495764291", tel:"+504 9576-4291"},
  {nombre:"Oliver Villeda", num:"50433723881", tel:"+504 3372-3881"}
];
// Niveles de combustible para elegir
var COMBUSTIBLE = ["Lleno","3/4 de tanque","1/2 tanque","1/4 de tanque","En reserva"];
// ===========================
var $=function(id){return document.getElementById(id)};
var fotos=[];
function pad(n){return String(n).padStart(2,"0")}
function fmt(n){return Number(n).toLocaleString("es-HN")}
(function(){var d=new Date();$("fec").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())})();

function llenar(selId,ph,lista,otroTxt,otroId){
  var sel=$(selId);
  function op(v,t){var o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o)}
  op("",ph);lista.forEach(function(v){op(v,v)});
  if(otroTxt){
    op("__otro",otroTxt);
    sel.addEventListener("change",function(){var o=$(otroId);o.hidden=sel.value!=="__otro";if(!o.hidden)o.focus()});
  }
}
var KMS=[];for(var i=0;i<200000;i+=10000)KMS.push(fmt(i)+" – "+fmt(i+10000)+" km");KMS.push("Más de 200,000 km");
llenar("kmSel","Elige el kilometraje",KMS,"Escribir kilometraje exacto…","kmExacto");
llenar("comb","Elige el nivel de combustible",COMBUSTIBLE);
function kmVal(){var v=$("kmSel").value;if(v==="__otro"){var n=$("kmExacto").value;return n===""?"":fmt(n)+" km"}return v}
function campos(){
  return [["Marca",$("marca").value.trim(),$("marcaCom").value.trim()],
          ["Vehículo",$("veh").value.trim(),$("vehCom").value.trim()],
          ["Kilometraje",kmVal(),$("kmCom").value.trim()],
          ["Combustible",$("comb").value,$("combCom").value.trim()]];
}
function fechaTxt(){return $("fec").value?new Date($("fec").value).toLocaleString("es-HN"):""}
function msg(t,err){$("msg").textContent=t;$("msg").className=err?"err":""}

$("selF").onclick=function(){$("fotos").click()};
$("fotos").onchange=function(e){
  Array.prototype.forEach.call(e.target.files,function(f){shrink(f).then(function(b){fotos.push(b);draw()})});
  e.target.value="";
};
function shrink(file){
  return new Promise(function(ok){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){ok(new File([b],"foto"+Date.now()+Math.floor(Math.random()*99)+".jpg",{type:"image/jpeg"}))},"image/jpeg",0.8);
    };
    img.onerror=function(){ok(file)};img.src=u;
  });
}
function draw(){
  $("thumbs").innerHTML="";
  fotos.forEach(function(f,i){
    var d=document.createElement("div");d.className="th";
    var im=document.createElement("img");im.src=URL.createObjectURL(f);im.alt="Foto "+(i+1);
    var b=document.createElement("button");b.type="button";b.textContent="×";b.setAttribute("aria-label","Quitar foto "+(i+1));
    b.onclick=function(){fotos.splice(i,1);draw()};
    d.appendChild(im);d.appendChild(b);$("thumbs").appendChild(d);
  });
}

function buildText(){
  var L=["*REVISIÓN DEL VEHÍCULO - PRO AUTOS*","",
    "*Encargado de revisión:* "+$("enc").value.trim(),
    "*Fecha:* "+fechaTxt(),""];
  campos().forEach(function(c){
    L.push("*"+c[0]+":* "+(c[1]||"No indicado"));
    if(c[2])L.push("Comentarios: "+c[2]);
    L.push("");
  });
  L.push("*Fotos adjuntas:* "+fotos.length);
  return L.join("\n");
}

// ===== Imagen única de la revisión (datos + comentarios + fotos) =====
var cache={key:"",file:null,busy:false};
function stateKey(){return buildText()+"|"+fotos.map(function(f){return f.name+f.size}).join(",")}
function loadImg(f){return new Promise(function(ok){var i=new Image(),u=URL.createObjectURL(f);i.onload=function(){ok(i)};i.onerror=function(){ok(null)};i.src=u})}
function wrap(x,text,maxW){
  var out=[];
  String(text).split("\n").forEach(function(par){
    var line="";
    par.split(/\s+/).forEach(function(w){
      while(x.measureText(w).width>maxW){var k=w.length;while(k>1&&x.measureText(w.slice(0,k)).width>maxW)k--;if(line){out.push(line);line=""}out.push(w.slice(0,k));w=w.slice(k)}
      var t=line?line+" "+w:w;
      if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t;
    });
    out.push(line);
  });
  return out;
}
function compose(){
  var W=1080,P=40,cw=W-2*P,cv=document.createElement("canvas"),x=cv.getContext("2d");
  var items=[["Encargado de revisión",$("enc").value.trim()],["Fecha",fechaTxt()]].concat(
    campos().map(function(c){return [c[0],(c[1]||"No indicado")+(c[2]?"\nComentarios: "+c[2]:"")]}));
  x.font="30px Arial,Helvetica,sans-serif";
  var blocks=items.map(function(it){return {l:it[0],t:wrap(x,it[1],cw)}});
  var lg=document.querySelector("header img"),lw=Math.min(cw,520),lh=(lg&&lg.naturalWidth)?lw*lg.naturalHeight/lg.naturalWidth:0;
  return Promise.all(fotos.map(loadImg)).then(function(imgs){
    imgs=imgs.filter(Boolean);
    var cols=imgs.length===1?1:2,gap=16,tw=(cw-(cols-1)*gap)/cols,th=Math.round(tw*.75),rows=Math.ceil(imgs.length/cols);
    var H=P+lh+20+70+20;
    blocks.forEach(function(b){H+=34+b.t.length*40+14});
    if(imgs.length)H+=30+rows*(th+gap);
    H+=70;
    cv.width=W;cv.height=H;
    x.fillStyle="#fff";x.fillRect(0,0,W,H);
    var y=P;
    if(lh){x.drawImage(lg,(W-lw)/2,y,lw,lh);y+=lh+20}
    x.fillStyle="#1a6b2a";x.fillRect(0,y,W,70);
    x.fillStyle="#fff";x.font="bold 34px Arial,Helvetica,sans-serif";x.textBaseline="middle";x.textAlign="center";
    x.fillText("REVISIÓN DE VEHÍCULO",W/2,y+35);y+=70+20;
    x.textAlign="left";x.textBaseline="alphabetic";
    blocks.forEach(function(b){
      x.fillStyle="#1a6b2a";x.font="bold 26px Arial,Helvetica,sans-serif";x.fillText(b.l,P,y+24);y+=34;
      x.fillStyle="#12301a";x.font="30px Arial,Helvetica,sans-serif";
      b.t.forEach(function(l){x.fillText(l,P,y+30);y+=40});y+=14;
    });
    if(imgs.length){
      y+=10;x.fillStyle="#1a6b2a";x.font="bold 26px Arial,Helvetica,sans-serif";x.fillText("Fotos ("+imgs.length+")",P,y+10);y+=20;
      imgs.forEach(function(im,i){
        var cx=P+(i%cols)*(tw+gap),cy=y+Math.floor(i/cols)*(th+gap);
        x.fillStyle="#eef3ea";x.fillRect(cx,cy,tw,th);
        var r=Math.min(tw/im.naturalWidth,th/im.naturalHeight),dw=im.naturalWidth*r,dh=im.naturalHeight*r;
        x.drawImage(im,cx+(tw-dw)/2,cy+(th-dh)/2,dw,dh);
      });
    }
    x.fillStyle="#5b6e60";x.font="22px Arial,Helvetica,sans-serif";x.textAlign="center";
    x.fillText("Pro Autos · Tu mejor opción en vehículos importados",W/2,H-30);
    return new Promise(function(ok){cv.toBlob(function(b){ok(new File([b],"revision-vehiculo.jpg",{type:"image/jpeg"}))},"image/jpeg",.88)});
  });
}
// Prepara la imagen en segundo plano para poder enviar al instante
setInterval(function(){
  if(!fotos.length||cache.busy)return;
  var k=stateKey();if(k===cache.key)return;
  cache.busy=true;
  compose().then(function(fl){cache={key:k,file:fl,busy:false}}).catch(function(){cache.busy=false});
},1500);

function enviar(d){
  if(!/^\d{10,15}$/.test(d.num)){msg("Falta poner el número de WhatsApp de "+d.nombre+" en el código.",true);return}
  var c=campos();
  if(!$("enc").value.trim()||!c[0][1]||!c[1][1]||!c[2][1]||!c[3][1]){msg("Completa el encargado de revisión, marca, vehículo, kilometraje y combustible antes de enviar.",true);return}
  var text=buildText(),k=stateKey();
  var puede=!!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"a.jpg",{type:"image/jpeg"})]}));
  $("descarga").hidden=true;
  function compartir(fl,reintento){
    navigator.share({files:[fl],text:text,title:"Revisión de vehículo Pro Autos"})
      .then(function(){msg("Elige WhatsApp y el chat de "+d.nombre+" ("+d.tel+"). Todo va junto en un solo envío.")})
      .catch(function(e){
        if(e.name==="AbortError")return;
        if(e.name==="NotAllowedError"&&reintento)msg("La revisión ya está lista. Toca otra vez el botón para enviarla.");
        else msg("No se pudo compartir. Intenta de nuevo.",true);
      });
  }
  if(fotos.length&&puede){
    if(cache.key===k&&cache.file){compartir(cache.file,false)}
    else{msg("Preparando la revisión con las fotos…");compose().then(function(fl){cache={key:k,file:fl,busy:false};compartir(fl,true)})}
    return;
  }
  window.open("https://wa.me/"+d.num+"?text="+encodeURIComponent(text),"_blank");
  msg("Se abrió WhatsApp con "+d.nombre+" ("+d.tel+"). Confirma que es el número correcto y presiona enviar.");
  if(fotos.length){
    compose().then(function(fl){
      $("descarga").href=URL.createObjectURL(fl);$("descarga").hidden=false;
      msg("Se abrió WhatsApp con "+d.nombre+" ("+d.tel+"). Este dispositivo no envía fotos junto al texto: descarga la imagen de la revisión (trae todo junto) y adjúntala en el chat.");
    });
  }
}
DESTINOS.forEach(function(d){
  var b=document.createElement("button");b.type="button";b.className="pri";
  b.textContent=DESTINOS.length>1?"Enviar a "+d.nombre:"Enviar todo por WhatsApp";
  var sm=document.createElement("small");sm.textContent=d.nombre+" · "+d.tel;sm.style.cssText="display:block;font-weight:500;font-size:.8rem;opacity:.9";
  b.appendChild(sm);b.onclick=function(){enviar(d)};$("envios").appendChild(b);
});

</script>
</body>
</html>
